services:
  database:
    image: postgres:16-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: ${JOOMLA_DB_NAME:-joomladb}
      POSTGRES_USER: ${JOOMLA_DB_USER:-joomlauser}
      POSTGRES_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomlapassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOOMLA_DB_USER:-joomlauser} -d ${JOOMLA_DB_NAME:-joomladb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  joomla:
    image: joomla:latest
    container_name: joomla
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      JOOMLA_DB_HOST: database
      JOOMLA_DB_USER: ${JOOMLA_DB_USER:-joomlauser}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-joomlapassword}
      JOOMLA_DB_NAME: ${JOOMLA_DB_NAME:-joomladb}
      JOOMLA_DB_TYPE: pgsql
    volumes:
      - joomla_data:/var/www/html
      - ./joomla_logs:/var/log/apache2
      - ./configuration.php:/var/www/html/configuration.php
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - joomla
    networks:
      - frontend_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend_net
      - backend_net

  jupyter:
    image: jupyter/base-notebook:latest
    container_name: jupyter
    restart: always
    ports:
      - "8888:8888"
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary pandas sqlalchemy && start-notebook.sh --NotebookApp.token=''"
    volumes:
      - ./jupyter:/home/jovyan/work
    networks:
      - backend_net

volumes:
  postgres_data:
  joomla_data:
  grafana_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
